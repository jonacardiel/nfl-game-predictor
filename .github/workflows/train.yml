name: Retrain models

# Manual only — a scheduled run should never silently swap the live model out.
# Run this once at the start of a new season (or whenever you want to pull in
# a newly completed season / rerun with a data fix), then commit the result.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train models
        run: python train.py

      - name: Commit updated models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "Retrain models [automated]"
          git push

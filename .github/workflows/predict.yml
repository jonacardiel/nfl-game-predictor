name: Weekly predictions

on:
  schedule:
    # Tuesdays 13:00 UTC (~8am ET) — previous week is final, new week's lines are posted.
    - cron: "0 13 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-predictions
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate site data
        run: python export_web.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "Update weekly predictions [automated]"
          git push
